<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Copley Square / Boston DFL Labor Tool</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Roboto+Mono:wght@400;500&display=swap');
        body { font-family: 'Inter', system_ui, sans-serif; }
        .mono { font-family: 'Roboto Mono', monospace; }
    </style>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen">
    <div class="max-w-5xl mx-auto p-6">
        <h1 class="text-3xl font-semibold text-red-400 mb-2 flex items-center gap-3">
            <i class="fa-solid fa-chart-line"></i> Copley Square / Boston DFL Labor Tool
        </h1>
        <p class="text-zinc-400 mb-8">Real-time labor intelligence • Chick-fil-A Copley Square</p>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
            <!-- Hourly -->
            <div class="bg-zinc-900 rounded-3xl p-8 border border-zinc-700">
                <h2 class="text-2xl font-semibold mb-6">Hourly Labor Calculator</h2>
                <div class="space-y-6">
                    <div>
                        <label class="block text-zinc-400 mb-2">Average Hourly Rate ($)</label>
                        <input id="hourly-rate" type="number" step="0.01" value="18.50" class="w-full bg-zinc-800 border border-zinc-700 rounded-2xl px-5 py-4 text-lg mono">
                    </div>
                    <div>
                        <label class="block text-zinc-400 mb-2">Labor Hours on Clock</label>
                        <input id="hours-on-clock" type="number" step="0.1" value="45" class="w-full bg-zinc-800 border border-zinc-700 rounded-2xl px-5 py-4 text-lg mono">
                    </div>
                    <div>
                        <label class="block text-zinc-400 mb-2">Expected Revenue This Hour ($)</label>
                        <input id="hourly-revenue" type="number" step="1" value="1200" class="w-full bg-zinc-800 border border-zinc-700 rounded-2xl px-5 py-4 text-lg mono">
                    </div>
                </div>
                <button onclick="calculateHourly()" class="mt-8 w-full bg-red-600 hover:bg-red-500 py-5 rounded-2xl font-semibold text-lg">CALCULATE LABOR %</button>
                <div id="hourly-result" class="mt-8 hidden bg-zinc-950 border border-zinc-700 rounded-3xl p-8">
                    <div id="labor-percent" class="text-6xl font-bold mono"></div>
                    <div id="status" class="text-5xl my-4"></div>
                    <div id="labor-cost" class="mono text-lg"></div>
                </div>
            </div>

            <!-- Monthly -->
            <div class="bg-zinc-900 rounded-3xl p-8 border border-zinc-700">
                <h2 class="text-2xl font-semibold mb-6">Monthly Goal Planner (MTD Sales)</h2>
                <div class="grid
