<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Copley Square / Boston DFL Labor Tool</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Roboto+Mono:wght@400;500&display=swap');
        body { font-family: 'Inter', system_ui, sans-serif; }
        .mono { font-family: 'Roboto Mono', monospace; }
    </style>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen">
    <div class="max-w-5xl mx-auto p-6">
        <h1 class="text-3xl font-semibold text-red-400 mb-2 flex items-center gap-3">
            <i class="fa-solid fa-chart-line"></i> Copley Square / Boston DFL Labor Tool
        </h1>
        <p class="text-zinc-400 mb-8">Real-time labor intelligence • Chick-fil-A Copley Square</p>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
            <!-- Hourly -->
            <div class="bg-zinc-900 rounded-3xl p-8 border border-zinc-700">
                <h2 class="text-2xl font-semibold mb-6">Hourly Labor Calculator</h2>
                <div class="space-y-6">
                    <div>
                        <label class="block text-zinc-400 mb-2">Average Hourly Rate ($)</label>
                        <input id="hourly-rate" type="number" step="0.01" value="18.50" class="w-full bg-zinc-800 border border-zinc-700 rounded-2xl px-5 py-4 text-lg mono">
                    </div>
                    <div>
                        <label class="block text-zinc-400 mb-2">Labor Hours on Clock</label>
                        <input id="hours-on-clock" type="number" step="0.1" value="45" class="w-full bg-zinc-800 border border-zinc-700 rounded-2xl px-5 py-4 text-lg mono">
                    </div>
                    <div>
                        <label class="block text-zinc-400 mb-2">Expected Revenue This Hour ($)</label>
                        <input id="hourly-revenue" type="number" step="1" value="1200" class="w-full bg-zinc-800 border border-zinc-700 rounded-2xl px-5 py-4 text-lg mono">
                    </div>
                </div>
                <button onclick="calculateHourly()" class="mt-8 w-full bg-red-600 hover:bg-red-500 py-5 rounded-2xl font-semibold text-lg">CALCULATE LABOR %</button>
                <div id="hourly-result" class="mt-8 hidden bg-zinc-950 border border-zinc-700 rounded-3xl p-8">
                    <div id="labor-percent" class="text-6xl font-bold mono"></div>
                    <div id="status" class="text-5xl my-4"></div>
                    <div id="labor-cost" class="mono text-lg"></div>
                    <div id="hourly-suggestion" class="mt-6 text-sm"></div>
                </div>
            </div>

            <!-- Monthly -->
            <div class="bg-zinc-900 rounded-3xl p-8 border border-zinc-700">
                <h2 class="text-2xl font-semibold mb-6">Monthly Goal Planner (MTD Sales)</h2>
                <div class="grid grid-cols-2 gap-6">
                    <div>
                        <label class="block text-zinc-400 mb-2">Sales MTD ($)</label>
                        <input id="sales-mtd" type="number" value="320000" class="w-full bg-zinc-800 border border-zinc-700 rounded-2xl px-5 py-4 mono">
                    </div>
                    <div>
                        <label class="block text-zinc-400 mb-2">Target Labor %</label>
                        <input id="target-percent" type="number" step="0.1" value="28" class="w-full bg-zinc-800 border border-zinc-700 rounded-2xl px-5 py-4 mono">
                    </div>
                    <div>
                        <label class="block text-zinc-400 mb-2">Total Labor Hours So Far</label>
                        <input id="hours-so-far" type="number" step="0.1" value="5200" class="w-full bg-zinc-800 border border-zinc-700 rounded-2xl px-5 py-4 mono">
                    </div>
                    <div>
                        <label class="block text-zinc-400 mb-2">Avg Hourly Rate ($)</label>
                        <input id="hourly-rate-m" type="number" step="0.01" value="18.50" class="w-full bg-zinc-800 border border-zinc-700 rounded-2xl px-5 py-4 mono">
                    </div>
                </div>
                <button onclick="calculateMonthly()" class="mt-8 w-full bg-sky-600 hover:bg-sky-500 py-5 rounded-2xl font-semibold text-lg">PROJECT REMAINING</button>
                <div id="monthly-result" class="mt-8 hidden p-8 bg-zinc-950 border border-zinc-700 rounded-3xl">
                    <div id="monthly-insights" class="text-lg leading-relaxed"></div>
                </div>
            </div>
        </div>

        <!-- Daily -->
        <div class="mt-8 bg-zinc-900 rounded-3xl p-8 border border-zinc-700">
            <h2 class="text-2xl font-semibold mb-6">Today's Labor Adjustment (Live Hours Left)</h2>
            <div class="grid grid-cols-2 gap-6">
                <div>
                    <label class="block text-zinc-400 mb-2">Today's Sales So Far ($)</label>
                    <input id="today-sales" type="number" value="8500" class="w-full bg-zinc-800 border border-zinc-700 rounded-2xl px-5 py-4 mono">
                </div>
                <div>
                    <label class="block text-zinc-400 mb-2">Target Labor %</label>
                    <input id="today-target" type="number" step="0.1" value="28" class="w-full bg-zinc-800 border border-zinc-700 rounded-2xl px-5 py-4 mono">
                </div>
                <div>
                    <label class="block text-zinc-400 mb-2">Hours Worked Today So Far</label>
                    <input id="today-hours" type="number" step="0.1" value="85" class="w-full bg-zinc-800 border border-zinc-700 rounded-2xl px-5 py-4 mono">
                </div>
                <div>
                    <label class="block text-zinc-400 mb-2">Avg Hourly Rate ($)</label>
                    <input id="today-rate" type="number" step="0.01" value="18.50" class="w-full bg-zinc-800 border border-zinc-700 rounded-2xl px-5 py-4 mono">
                </div>
            </div>
            <button onclick="calculateDaily()" class="mt-8 w-full bg-amber-600 hover:bg-amber-500 py-5 rounded-2xl font-semibold text-lg">CALCULATE REMAINING HOURS</button>
            <div id="daily-result" class="mt-8 hidden p-8 bg-zinc-950 border border-zinc-700 rounded-3xl">
                <div id="daily-insights" class="text-lg leading-relaxed"></div>
            </div>
        </div>
    </div>

    <script>
        function calculateHourly() {
            const rate = parseFloat(document.getElementById('hourly-rate').value) || 0;
            const hours = parseFloat(document.getElementById('hours-on-clock').value) || 0;
            const revenue = parseFloat(document.getElementById('hourly-revenue').value) || 0;
            if (revenue === 0) return alert("Enter expected revenue");
            const percent = (hours * rate / revenue) * 100;
            const targetHours = revenue * 0.19 / rate;
            const hoursToCut = Math.max(0, hours - targetHours);

            document.getElementById('labor-percent').textContent = percent.toFixed(1) + '%';
            const status = document.getElementById('status');
            status.textContent = percent < 18 ? '🟢' : percent < 20 ? '🟡' : '🔴';
            document.getElementById('labor-cost').textContent = `Cost: $${(hours*rate).toFixed(2)}`;

            let suggestion = '';
            if (percent > 19) {
                suggestion = `<span class="text-red-400">Suggestion: Cut ~${hoursToCut.toFixed(1)} hours now to reach 19%.</span>`;
            }
            document.getElementById('hourly-suggestion').innerHTML = suggestion;
            document.getElementById('hourly-result').classList.remove('hidden');
        }

        function getRemainingSalesDays() {
            const today = new Date();
            let days = 0;
            let d = new Date(today.getFullYear(), today.getMonth() + 1, 0);
            for (let i = today.getDate(); i <= d.getDate(); i++) {
                let check = new Date(today.getFullYear(), today.getMonth(), i);
                if (check.getDay() !== 0) days++;
            }
            return Math.max(days, 1);
        }

        function calculateMonthly() {
            const salesMTD = parseFloat(document.getElementById('sales-mtd').value) || 0;
            const target = parseFloat(document.getElementById('target-percent').value) || 28;
            const hoursSoFar = parseFloat(document.getElementById('hours-so-far').value) || 0;
            const rate = parseFloat(document.getElementById('hourly-rate-m').value) || 18.5;

            const daysThisMonth = getRemainingSalesDays() + (new Date().getDate() - 1);
            const avgDailySales = daysThisMonth > 0 ? salesMTD / daysThisMonth : 0;
            const daysLeft = getRemainingSalesDays();
            const projectedRemaining = avgDailySales * daysLeft;
            const remainingLaborBudget = (salesMTD + projectedRemaining) * target / 100 - (hoursSoFar * rate);
            const dailyHours = daysLeft > 0 ? remainingLaborBudget / daysLeft / rate : 0;

            let msg = `Avg daily sales (MTD): <strong>$${avgDailySales.toFixed(0)}</strong><br>`;
            msg += `Sales days left (no Sundays): <strong>${daysLeft}</strong><br>`;
            msg += `Recommended daily labor hours: <strong>${dailyHours.toFixed(1)}</strong>`;
            document.getElementById('monthly-insights').innerHTML = msg;
            document.getElementById('monthly-result').classList.remove('hidden');
        }

        function calculateDaily() {
            const salesSoFar = parseFloat(document.getElementById('today-sales').value) || 0;
            const target = parseFloat(document.getElementById('today-target').value) || 28;
            const hoursSoFar = parseFloat(document.getElementById('today-hours').value) || 0;
            const rate = parseFloat(document.getElementById('today-rate').value) || 18.5;

            const now = new Date();
            let hoursLeft = 24 - (now.getHours() + now.getMinutes() / 60);
            hoursLeft = Math.max(hoursLeft, 0);

            const targetLabor = salesSoFar * target / 100;
            const currentCost = hoursSoFar * rate;
            const remainingBudget = targetLabor - currentCost;
            const remainingHours = remainingBudget / rate;

            let msg = `Current time: ${now.getHours()}:${now.getMinutes().toString().padStart(2, '0')}<br>`;
            msg += `Hours left until midnight: <strong>${hoursLeft.toFixed(1)}</strong><br><br>`;
            msg += `Target labor for day: $${targetLabor.toFixed(0)}<br>`;
            msg += `Current labor cost: $${currentCost.toFixed(0)}<br><br>`;
            if (remainingHours > 0) {
                msg += `You can still schedule <strong>${remainingHours.toFixed(1)}</strong> more hours today.`;
            } else {
                msg += `<span class="text-red-400">You are currently over target.</span>`;
            }
            document.getElementById('daily-insights').innerHTML = msg;
            document.getElementById('daily-result').classList.remove('hidden');
        }
    </script>
</body>
</html>
