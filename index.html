<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Copley Square / Boston DFL Labor Tool</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Roboto+Mono:wght@400;500&display=swap');
        body { font-family: 'Inter', system_ui, sans-serif; }
        .mono { font-family: 'Roboto Mono', monospace; }
    </style>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen">
    <div class="max-w-5xl mx-auto p-4 md:p-6">
        <div class="flex justify-between items-center mb-8">
            <div>
                <h1 class="text-3xl font-semibold flex items-center gap-3 text-red-400">
                    <i class="fa-solid fa-chart-line"></i>
                    Copley Square / Boston DFL Labor Tool
                </h1>
                <p class="text-zinc-400 text-sm">Real-time labor intelligence • Chick-fil-A Copley Square</p>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
            <!-- Hourly -->
            <div class="lg:col-span-5">
                <div class="bg-zinc-900 rounded-3xl p-6 border border-zinc-800">
                    <h2 class="text-xl font-semibold mb-6">Hourly Labor Calculator</h2>
                    <div class="space-y-5">
                        <div><label>Average Hourly Rate ($)</label><input id="hourly-rate" type="number" step="0.01" value="18.50" class="w-full bg-zinc-800 border border-zinc-700 rounded-2xl px-4 py-3 mono"></div>
                        <div><label>Labor Hours on Clock</label><input id="hours-on-clock" type="number" step="0.1" value="45" class="w-full bg-zinc-800 border border-zinc-700 rounded-2xl px-4 py-3 mono"></div>
                        <div><label>Expected Revenue This Hour ($)</label><input id="hourly-revenue" type="number" step="1" value="1200" class="w-full bg-zinc-800 border border-zinc-700 rounded-2xl px-4 py-3 mono"></div>
                    </div>
                    <button onclick="calculateHourly()" class="mt-6 w-full bg-red-600 hover:bg-red-500 py-4 rounded-2xl font-semibold">CALCULATE LABOR %</button>
                    <div id="hourly-result" class="mt-6 hidden bg-zinc-950 border border-zinc-700 rounded-2xl p-5">
                        <div id="labor-percent" class="text-5xl font-bold mono"></div>
                        <div id="status"></div>
                        <div id="labor-cost" class="mono"></div>
                    </div>
                </div>
            </div>

            <!-- Monthly -->
            <div class="lg:col-span-7">
                <div class="bg-zinc-900 rounded-3xl p-6 border border-zinc-800">
                    <h2 class="text-xl font-semibold mb-6">Monthly Goal Planner (Avg Daily Sales)</h2>
                    <div class="grid grid-cols-2 gap-4">
                        <div><label>Avg Daily Sales ($)</label><input id="avg-daily-sales" type="number" value="15000" class="w-full bg-zinc-800 border border-zinc-700 rounded-2xl px-4 py-3 mono"></div>
                        <div><label>Target Labor %</label><input id="target-percent" type="number" step="0.1" value="28" class="w-full bg-zinc-800 border border-zinc-700 rounded-2xl px-4 py-3 mono"></div>
                        <div><label>Total Labor Hours So Far</label><input id="hours-so-far" type="number" step="0.1" value="5200" class="w-full bg-zinc-800 border border-zinc-700 rounded-2xl px-4 py-3 mono"></div>
                        <div><label>Avg Hourly Rate ($)</label><input id="hourly-rate-m" type="number" step="0.01" value="18.50" class="w-full bg-zinc-800 border border-zinc-700 rounded-2xl px-4 py-3 mono"></div>
                    </div>
                    <button onclick="calculateMonthly()" class="mt-6 w-full bg-sky-600 hover:bg-sky-500 py-4 rounded-2xl font-semibold">PROJECT REMAINING</button>
                    <div id="monthly-result" class="mt-8 hidden p-5 bg-zinc-950 border border-zinc-700 rounded-2xl">
                        <div id="monthly-insights"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- New Daily Tool -->
        <div class="mt-8 bg-zinc-900 rounded-3xl p-6 border border-zinc-800">
            <h2 class="text-xl font-semibold mb-6">Today's Labor Adjustment</h2>
            <div class="grid grid-cols-2 gap-4">
                <div><label>Today's Projected Sales ($)</label><input id="today-sales" type="number" value="14000" class="w-full bg-zinc-800 border border-zinc-700 rounded-2xl px-4 py-3 mono"></div>
                <div><label>Target Labor %</label><input id="today-target" type="number" step="0.1" value="28" class="w-full bg-zinc-800 border border-zinc-700 rounded-2xl px-4 py-3 mono"></div>
                <div><label>Current Hours Today</label><input id="today-hours" type="number" step="0.1" value="120" class="w-full bg-zinc-800 border border-zinc-700 rounded-2xl px-4 py-3 mono"></div>
                <div><label>Avg Rate ($)</label><input id="today-rate" type="number" step="0.01" value="18.50" class="w-full bg-zinc-800 border border-zinc-700 rounded-2xl px-4 py-3 mono"></div>
            </div>
            <button onclick="calculateDaily()" class="mt-6 w-full bg-amber-600 hover:bg-amber-500 py-4 rounded-2xl font-semibold">ADJUST TODAY'S STAFFING</button>
            <div id="daily-result" class="mt-8 hidden p-5 bg-zinc-950 border border-zinc-700 rounded-2xl">
                <div id="daily-insights"></div>
            </div>
        </div>
    </div>

    <script>
        function calculateHourly() { /* unchanged - kept simple */ 
            const rate = parseFloat(document.getElementById('hourly-rate').value) || 0;
            const hours = parseFloat(document.getElementById('hours-on-clock').value) || 0;
            const revenue = parseFloat(document.getElementById('hourly-revenue').value) || 0;
            if (revenue === 0) return;
            const percent = (hours * rate / revenue) * 100;
            document.getElementById('labor-percent').textContent = percent.toFixed(1) + '%';
            document.getElementById('status').textContent = percent <= 30 ? '🟢' : '🔴';
            document.getElementById('labor-cost').textContent = `Cost: $${(hours*rate).toFixed(2)}`;
            document.getElementById('hourly-result').classList.remove('hidden');
        }

        function getRemainingSalesDays() {
            const today = new Date();
            let days = 0;
            let d = new Date(today);
            while (d.getMonth() === today.getMonth()) {
                if (d.getDay() !== 0) days++;
                d.setDate(d.getDate() + 1);
            }
            return Math.max(days, 1);
        }

        function calculateMonthly() {
            const avgDaily = parseFloat(document.getElementById('avg-daily-sales').value) || 0;
            const target = parseFloat(document.getElementById('target-percent').value) || 28;
            const hoursSoFar = parseFloat(document.getElementById('hours-so-far').value) || 0;
            const rate = parseFloat(document.getElementById('hourly-rate-m').value) || 18.5;

            const daysLeft = getRemainingSalesDays();
            const projectedRemainingRevenue = avgDaily * daysLeft;
            const totalProjected = projectedRemainingRevenue; // simplified for now
            const remainingLaborBudget = (totalProjected * target / 100) - (hoursSoFar * rate);
            const dailyHours = remainingLaborBudget / daysLeft / rate;

            let msg = `Sales days left (no Sundays): <strong>${daysLeft}</strong><br>`;
            msg += `Recommended daily labor hours: <strong>${dailyHours.toFixed(1)}</strong><br>`;
            msg += `Based on $${avgDaily.toLocaleString()} avg daily sales.`;
            document.getElementById('monthly-insights').innerHTML = msg;
            document.getElementById('monthly-result').classList.remove('hidden');
        }

        function calculateDaily() {
            const sales = parseFloat(document.getElementById('today-sales').value) || 0;
            const target = parseFloat(document.getElementById('today-target').value) || 28;
            const hours = parseFloat(document.getElementById('today-hours').value) || 0;
            const rate = parseFloat(document.getElementById('today-rate').value) || 18.5;

            const targetLabor = sales * target / 100;
            const currentLaborCost = hours * rate;
            const remainingBudget = targetLabor - currentLaborCost;
            const remainingHours = remainingBudget / rate;

            let msg = `Target labor for today: $${targetLabor.toFixed(0)}<br>`;
            msg += `Current labor cost: $${currentLaborCost.toFixed(0)}<br>`;
            msg += `You can still schedule <strong>${remainingHours.toFixed(1)}</strong> more hours today.`;
            document.getElementById('daily-insights').innerHTML = msg;
            document.getElementById('daily-result').classList.remove('hidden');
        }
    </script>
</body>
</html>
